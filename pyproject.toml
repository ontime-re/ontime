[project]
name = "ontime"
version = "0.8.0"
description = "Your library to work with time series"
authors = [{ name = "Fred Montet", email = "fredmontet@gmail.com" }]
requires-python = ">=3.10,<3.13"
readme = "README.md"
dependencies = [
    "darts>=0.30.0,<0.31",
    "catboost~=1.2",
    "altair>=5.1.0,<6",
    "torch>=2.0.0, !=2.0.1, !=2.1.0",
    "vegafusion-python-embed>=1.4.1,<2",
    "vegafusion[embed]>=1.4.1,<2",
    "protobuf>=4.24.4,<5",
    "vega-datasets>=0.9.0,<0.10",
    "ipywidgets>=8.1.1,<9",
    "altair-viewer>=0.4.0,<0.5",
    "tensorflow>=2.16.1,<3",
    "lightning>=2.2.4,<3",
    "numpy>=1.26.4,<2",
    "calmap>=0.0.11,<0.0.12",
    "alive-progress>=3.2.0,<4",
    "periodicity-detection>=0.1.3,<0.2",
    "tabulate>=0.9.0,<0.10",
    "skforecast>=0.19.1",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.0.5,<5",
    "pre-commit>=3.3.3,<4",
    "black",
    "nbmake>=1.4.6,<2",
    "pytest-xdist>=3.5.0,<4",
    "nbdime>=4.0.1,<5",
    "optuna~=3.6",
    "optuna-integration>=4.3.0,<5",
    "optuna-dashboard>=0.18.0,<0.19",
]
test = [
    "pytest>=7.4.4,<8",
    "jupyter>=1.0.0,<2",
    "papermill>=2.5.0,<3",
    "prefect"
]
docs = [
    "sphinx>=7.2.6,<8",
    "nbsphinx>=0.9.3,<0.10",
    "pydata-sphinx-theme>=0.15.2,<0.16",
    "recommonmark>=0.7.1,<0.8",
    "m2r>=0.3.1,<0.4",
    "pandoc~=2.3",
    "sphinx-autobuild>=2021.3.14,<2022",
    "lxml[html-clean]>=5.2.2,<6",
]

[tool.uv]
default-groups = [
    "dev",
    "test",
    "docs",
]

[tool.hatch.build.targets.sdist]
include = ["src/ontime"]

[tool.hatch.build.targets.wheel]
include = ["src/ontime"]

[tool.hatch.build.targets.wheel.sources]
"src/ontime" = "ontime"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


